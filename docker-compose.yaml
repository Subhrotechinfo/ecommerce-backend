services:
  products:
    build:
      context: .
      dockerfile: ./services/products/Dockerfile
      target: runner
    command: pnpm run dev
    container_name: Products_Service
    env_file:
      - ./services/products/.env
    ports:
      - '5000:5000'
    volumes:
      - .:/usr/src/app

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
      target: runner
    command: pnpm run dev
    container_name: Auth_Service
    env_file:
      - ./services/auth-service/.env
      - .env
    ports:
      - '5001:5001'
    expose:
      - '5002' #TCP port
    volumes:
      - .:/usr/src/app
  payments-service:
    build:
      context: .
      dockerfile: ./services/payments-service/Dockerfile
      target: runner
    command: pnpm run dev
    container_name: Payments_Service
    env_file:
      - ./services/payments-service/.env
    ports:
      - '5003:5003'
    expose:
      - '5004' #TCP port
    volumes:
      - .:/usr/src/app
  mongo:
    image: mongo
